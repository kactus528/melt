name: Build Mac VST3 + AU

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: |
          set -o pipefail
          cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 2>&1 | tee configure.log \
            || { echo "::error title=configure::$(tail -c 6000 configure.log | tr '\n' ' ')"; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target Melt_VST3 Melt_AU Melt_Standalone -- -quiet 2>&1 | tee build.log \
            || { echo "::error title=build::$(grep -E 'error|Error' build.log | tail -c 6000 | tr '\n' ' ')"; exit 1; }

      - name: Ad-hoc sign and package
        run: |
          cd build/Melt_artefacts/Release
          mkdir -p out
          cp -R VST3/Melt.vst3 AU/Melt.component Standalone/Melt.app out/
          for b in out/Melt.vst3 out/Melt.component out/Melt.app; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done
          lipo -info out/Melt.vst3/Contents/MacOS/Melt
          echo "::notice title=lipo::$(lipo -info out/Melt.vst3/Contents/MacOS/Melt)"
          cd out && ditto -c -k --keepParent . ../Melt-Mac.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Mac
          path: build/Melt_artefacts/Release/out
