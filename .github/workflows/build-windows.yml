name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Melt_VST3 Melt_Standalone

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Melt-VST3-Windows
          path: build/Melt_artefacts/Release/VST3/Melt.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Standalone-Windows
          path: build/Melt_artefacts/Release/Standalone/Melt.exe
