name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -A x64 2>&1 | tee configure.log \
            || { echo "::error title=configure::$(tail -c 6000 configure.log | tr '\n' ' ')"; exit 1; }

      - name: Build
        run: cmake --build build --config Release --target Melt_VST3 Melt_Standalone

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Melt-VST3-Windows
          path: build/Melt_artefacts/Release/VST3/Melt.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Melt-Standalone-Windows
          path: build/Melt_artefacts/Release/Standalone/Melt.exe
